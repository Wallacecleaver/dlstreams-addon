services:
  dlstreams-addon:
    build: .
    image: dlstreams-addon
    container_name: dlstreams-addon
    ports:
      - "8781:8781"        # Stremio/VLC accedent via http://<ip-hote>:8781
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./dlstreams_settings.json:/app/dlstreams_settings.json
      - ./dlstreams_sessions.json:/app/dlstreams_sessions.json
      - ./dlstreams_hist.json:/app/dlstreams_hist.json
      - ./dlstreams_epg.json:/app/dlstreams_epg.json
      - ./dashboard.html:/app/dashboard.html
      - ./configure.html:/app/configure.html
